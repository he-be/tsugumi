name: CI

# 自動起動は止めてある。push でも pull request でも走らない。
# 走らせたいときは Actions タブから "Run workflow" (workflow_dispatch) で手動起動する。
# 元の自動トリガは push (main) と pull_request で、macOS ランナーを使う。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build release products
        run: swift build -c release
      - name: Run serial tests
        run: Scripts/test.sh
      - name: Check Markdown links
        run: ruby Scripts/check_markdown_links.rb
      - name: Check the app version against the latest release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ruby Scripts/check_app_version.rb
